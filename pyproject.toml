[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watch-lab"
version = "0.3.0"
description = "A live seasonal discovery desk and local IMDb research console"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Antreas Antoniou" }]
dependencies = [
  "duckdb>=1.3,<2",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
watch-lab = "watchlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/watchlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
